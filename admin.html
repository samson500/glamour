<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glamour Admin</title>
    <link rel="icon" type="image/png" href="glamour/golove.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #070705;
            --gold: #f2be25;
            --gold-2: #ffd447;
            --green: #03ffaf;
            --panel: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.09);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top right, rgba(242,190,37,.10), transparent 24%),
                        radial-gradient(circle at bottom left, rgba(3,255,175,.07), transparent 30%),
                        var(--bg);
            color: #fff;
            min-height: 100vh;
        }

        /* ── Login overlay ── */
        #loginOverlay {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(7,7,5,.97);
            z-index: 100;
        }

        .login-card {
            width: min(100%, 400px);
            padding: 2.5rem;
            border-radius: 28px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .login-card img { width: 56px; margin-bottom: 1.2rem; }
        .login-card h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: .25rem; }
        .login-card p  { font-size: .9rem; color: rgba(255,255,255,.55); margin-bottom: 1.8rem; }

        .login-input {
            width: 100%;
            padding: .85rem 1.2rem;
            border-radius: 14px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.12);
            color: #fff;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            outline: none;
            margin-bottom: 1rem;
        }

        .login-input:focus { border-color: var(--green); }

        .login-error {
            font-size: .85rem;
            color: #ff6b6b;
            margin-bottom: .8rem;
            min-height: 1.2em;
        }

        /* ── Admin shell ── */
        #adminShell { display: none; }

        .admin-header {
            position: sticky; top: 0;
            padding: 1rem 1.5rem;
            background: rgba(7,7,5,.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            z-index: 10;
        }

        .admin-logo {
            display: flex; align-items: center; gap: 12px;
            font-size: 1.3rem; font-weight: 800;
        }

        .admin-logo img { width: 36px; }
        .admin-logo span { color: var(--green); }

        .admin-badge {
            padding: .3rem .9rem;
            border-radius: 999px;
            background: rgba(242,190,37,.15);
            border: 1px solid rgba(242,190,37,.3);
            font-size: .78rem;
            font-weight: 700;
            color: var(--gold);
        }

        .logout-btn {
            padding: .4rem 1rem;
            border-radius: 999px;
            background: rgba(255,255,255,.06);
            border: 1px solid var(--border);
            color: rgba(255,255,255,.7);
            font-size: .82rem;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: background .2s;
        }

        .logout-btn:hover { background: rgba(255,255,255,.1); }

        .admin-body {
            width: min(100%, 1100px);
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        /* ── Cards ── */
        .admin-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 1.8rem 2rem;
            margin-bottom: 1.8rem;
        }

        .admin-card-title {
            font-size: 1rem;
            font-weight: 700;
            color: rgba(255,255,255,.5);
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-bottom: 1.2rem;
        }

        /* ── Link editor ── */
        .link-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .link-input {
            flex: 1;
            padding: .85rem 1.2rem;
            border-radius: 14px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.12);
            color: #fff;
            font-size: .95rem;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: border-color .2s;
        }

        .link-input:focus { border-color: var(--green); }

        .save-btn {
            padding: .85rem 1.6rem;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--green), #00c98c);
            border: none;
            color: #071a0f;
            font-weight: 700;
            font-size: .95rem;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: filter .2s;
            white-space: nowrap;
        }

        .save-btn:disabled { opacity: .5; cursor: not-allowed; }
        .save-btn:not(:disabled):hover { filter: brightness(1.08); }

        .link-status {
            font-size: .85rem;
            margin-top: .6rem;
            min-height: 1.2em;
            color: var(--green);
        }

        .link-status.error { color: #ff6b6b; }

        .current-link-label {
            font-size: .82rem;
            color: rgba(255,255,255,.4);
            margin-bottom: .6rem;
        }

        .current-link-value {
            font-size: .88rem;
            color: rgba(255,255,255,.75);
            word-break: break-all;
        }

        /* ── Stats row ── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-bottom: 1.8rem;
        }

        .stat-box {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 1.2rem 1.4rem;
        }

        .stat-label {
            font-size: .78rem;
            color: rgba(255,255,255,.45);
            text-transform: uppercase;
            letter-spacing: .07em;
            margin-bottom: .3rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
        }

        .stat-value.gold  { color: var(--gold); }
        .stat-value.green { color: var(--green); }

        /* ── Users table ── */
        .users-table-wrap {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: .88rem;
        }

        thead th {
            padding: .9rem 1.1rem;
            text-align: left;
            font-size: .75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: rgba(255,255,255,.4);
            background: rgba(255,255,255,.03);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        tbody td {
            padding: .85rem 1.1rem;
            border-bottom: 1px solid rgba(255,255,255,.04);
            color: rgba(255,255,255,.82);
            vertical-align: middle;
        }

        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: rgba(255,255,255,.025); }

        .badge-active {
            display: inline-flex; align-items: center; gap: 5px;
            padding: .25rem .75rem;
            border-radius: 999px;
            font-size: .75rem;
            font-weight: 700;
            background: rgba(3,255,175,.12);
            color: var(--green);
            border: 1px solid rgba(3,255,175,.2);
        }

        .badge-pending {
            display: inline-flex; align-items: center; gap: 5px;
            padding: .25rem .75rem;
            border-radius: 999px;
            font-size: .75rem;
            font-weight: 700;
            background: rgba(242,190,37,.1);
            color: var(--gold);
            border: 1px solid rgba(242,190,37,.2);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: rgba(255,255,255,.35);
        }

        .refresh-btn {
            padding: .45rem 1.1rem;
            border-radius: 999px;
            background: rgba(255,255,255,.06);
            border: 1px solid var(--border);
            color: rgba(255,255,255,.7);
            font-size: .82rem;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: background .2s;
        }

        .refresh-btn:hover { background: rgba(255,255,255,.1); }

        .toast-bar {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            padding: .75rem 1.5rem;
            border-radius: 999px;
            background: rgba(3,255,175,.95);
            color: #071a0f;
            font-weight: 700;
            font-size: .9rem;
            opacity: 0; pointer-events: none;
            transition: opacity .25s;
            z-index: 200;
            white-space: nowrap;
        }

        .toast-bar.show { opacity: 1; }
    </style>
</head>
<body>

<!-- ── Login overlay ─────────────────────────────────────────────────────── -->
<div id="loginOverlay">
    <div class="login-card">
        <img src="glamour/golove.png" alt="Glamour">
        <h2>Admin Access</h2>
        <p>Enter the admin password to continue</p>
        <input type="password" id="passwordInput" class="login-input" placeholder="Password" autocomplete="current-password">
        <div class="login-error" id="loginError"></div>
        <button class="save-btn w-100" id="loginBtn">Enter</button>
    </div>
</div>

<!-- ── Admin shell ────────────────────────────────────────────────────────── -->
<div id="adminShell">
    <header class="admin-header">
        <div class="admin-logo">
            <img src="glamour/golove.png" alt="Glamour">
            Glamour<span>.</span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="admin-badge">Admin Panel</span>
            <button class="logout-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket me-1"></i>Logout</button>
        </div>
    </header>

    <div class="admin-body">

        <!-- Stats -->
        <div class="stats-row" id="statsRow">
            <div class="stat-box">
                <div class="stat-label">Total Transactions</div>
                <div class="stat-value gold" id="statTotal">—</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Total Funds</div>
                <div class="stat-value green" id="statFunds">—</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Avg. per User</div>
                <div class="stat-value" id="statAvg" style="color:rgba(255,255,255,.6)">—</div>
            </div>
        </div>

        <!-- WhatsApp link editor -->
        <div class="admin-card">
            <div class="admin-card-title"><i class="fa-brands fa-whatsapp me-2" style="color:#25d366"></i>WhatsApp Redirect Link</div>
            <div class="current-link-label">Current link</div>
            <div class="current-link-value" id="currentLinkDisplay">Loading…</div>
            <div class="link-row mt-3">
                <input type="url" class="link-input" id="waLinkInput" placeholder="https://wa.me/message/XXXXXXXX">
                <button class="save-btn" id="saveLinkBtn">Save</button>
            </div>
            <div class="link-status" id="linkStatus"></div>
        </div>

        <!-- Recent Transactions -->
        <div class="admin-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="admin-card-title mb-0"><i class="fa-solid fa-receipt me-2"></i>Recent Transactions</div>
                <button class="refresh-btn" id="refreshBtn"><i class="fa-solid fa-rotate-right me-1"></i>Refresh</button>
            </div>
            <div class="users-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Amount (NGN)</th>
                            <th>Reference</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="6" class="empty-state">Loading transactions…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<div class="toast-bar" id="toastBar"></div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp }                         from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ── REPLACE with your Firebase project config ──────────────────────────
    const firebaseConfig = {
        apiKey:            "AIzaSyDrnmtx0LkfMKytzTKQZwXCg1JKZXiJmtU",
        authDomain:        "glamour-28049.firebaseapp.com",
        projectId:         "glamour-28049",
        storageBucket:     "glamour-28049.firebasestorage.app",
        messagingSenderId: "22177815395",
        appId:             "1:22177815395:web:2ca7caa2b1626299675156"
    };
    // ── REPLACE with the admin password you want ───────────────────────────
    const ADMIN_PASSWORD = "glamour001";
    // ───────────────────────────────────────────────────────────────────────

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    const SESSION_KEY = "glamour_admin_authed";

    // ── Helpers ────────────────────────────────────────────────────────────
    function showToast(msg) {
        const bar = document.getElementById("toastBar");
        bar.textContent = msg;
        bar.classList.add("show");
        setTimeout(() => bar.classList.remove("show"), 2000);
    }

    // ── Login / logout ─────────────────────────────────────────────────────
    function revealAdmin() {
        document.getElementById("loginOverlay").style.display = "none";
        document.getElementById("adminShell").style.display   = "block";
        loadConfig();
        loadUsers();
    }

    function checkSession() {
        if (sessionStorage.getItem(SESSION_KEY) === "1") revealAdmin();
    }

    document.getElementById("loginBtn").addEventListener("click", () => {
        const val = document.getElementById("passwordInput").value;
        const err = document.getElementById("loginError");
        if (val === ADMIN_PASSWORD) {
            sessionStorage.setItem(SESSION_KEY, "1");
            err.textContent = "";
            revealAdmin();
        } else {
            err.textContent = "Incorrect password. Try again.";
            document.getElementById("passwordInput").value = "";
        }
    });

    document.getElementById("passwordInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") document.getElementById("loginBtn").click();
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
        sessionStorage.removeItem(SESSION_KEY);
        location.reload();
    });

    checkSession();

    // ── Config (WhatsApp link) ─────────────────────────────────────────────
    const CONFIG_DOC = doc(db, "config", "settings");

    async function loadConfig() {
        try {
            const snap = await getDoc(CONFIG_DOC);
            const link = snap.exists() ? (snap.data().whatsappLink || "") : "";
            document.getElementById("currentLinkDisplay").textContent = link || "Not set";
            document.getElementById("waLinkInput").value = link;
        } catch (err) {
            document.getElementById("currentLinkDisplay").textContent = "Error loading — check Firestore rules";
        }
    }

    document.getElementById("saveLinkBtn").addEventListener("click", async () => {
        const btn    = document.getElementById("saveLinkBtn");
        const status = document.getElementById("linkStatus");
        const input  = document.getElementById("waLinkInput");
        const link   = input.value.trim();

        if (!link.startsWith("http")) {
            status.textContent = "Please enter a valid URL.";
            status.className   = "link-status error";
            return;
        }

        btn.disabled    = true;
        btn.textContent = "Saving…";
        status.textContent = "";

        try {
            await setDoc(CONFIG_DOC, { whatsappLink: link }, { merge: true });
            document.getElementById("currentLinkDisplay").textContent = link;
            status.textContent = "✓ Link saved successfully.";
            status.className   = "link-status";
            showToast("WhatsApp link updated!");
        } catch (err) {
            status.textContent = "Save failed. Check Firestore permissions.";
            status.className   = "link-status error";
        } finally {
            btn.disabled    = false;
            btn.textContent = "Save";
        }
    });

    // ── Users table ────────────────────────────────────────────────────────
    async function loadUsers() {
        const tbody = document.getElementById("usersTableBody");
        tbody.innerHTML = `<tr><td colspan="6" class="empty-state">Loading…</td></tr>`;

        try {
            const snap  = await getDocs(collection(db, "users"));
            const users = [];
            snap.forEach((d) => users.push(d.data()));

            // Only count paid/activated users as transactions
            const transactions = users.filter(u => u.activated && u.koraReference);

            // Stats
            const totalFunds = transactions.reduce((sum, u) => sum + Number(u.activationAmount || 0), 0);
            const avg        = transactions.length ? Math.round(totalFunds / transactions.length) : 0;

            document.getElementById("statTotal").textContent = transactions.length;
            document.getElementById("statFunds").textContent = `₦${totalFunds.toLocaleString()}`;
            document.getElementById("statAvg").textContent   = transactions.length ? `₦${avg.toLocaleString()}` : "—";

            if (transactions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No transactions yet.</td></tr>`;
                return;
            }

            // Sort newest first
            transactions.sort((a, b) => {
                const ta = a.joinedAt?.seconds ? a.joinedAt.seconds * 1000 : new Date(a.joinedAt || 0).getTime();
                const tb = b.joinedAt?.seconds ? b.joinedAt.seconds * 1000 : new Date(b.joinedAt || 0).getTime();
                return tb - ta;
            });

            tbody.innerHTML = transactions.map((u, i) => {
                const date = u.joinedAt?.seconds
                    ? new Date(u.joinedAt.seconds * 1000).toLocaleString("en-NG", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" })
                    : u.joinedAt ? new Date(u.joinedAt).toLocaleString("en-NG", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" })
                    : "—";

                const ref = u.koraReference || "—";
                const shortRef = ref.length > 20 ? ref.slice(0, 20) + "…" : ref;

                return `<tr>
                    <td style="color:rgba(255,255,255,.35)">${i + 1}</td>
                    <td style="font-weight:600">${esc(u.fullName || "—")}</td>
                    <td style="color:rgba(255,255,255,.6)">${esc(u.email || "—")}</td>
                    <td style="color:var(--green);font-weight:700">₦${Number(u.activationAmount || 0).toLocaleString()}</td>
                    <td style="color:rgba(255,255,255,.4);font-size:.8rem;font-family:monospace" title="${esc(ref)}">${esc(shortRef)}</td>
                    <td style="color:rgba(255,255,255,.45);white-space:nowrap">${date}</td>
                </tr>`;
            }).join("");

        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="6" class="empty-state">Failed to load. Check Firestore rules.</td></tr>`;
        }
    }

    document.getElementById("refreshBtn").addEventListener("click", () => {
        loadUsers();
        showToast("Refreshed");
    });

    function esc(str) {
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }
</script>

</body>
</html>
